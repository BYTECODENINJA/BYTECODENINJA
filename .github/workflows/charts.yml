name: Forge Charts

# Refreshes the language radar + monthly & daily contribution splines in ./assets
on:
  schedule:
    - cron: "17 3 * * *"        # daily, 03:17 UTC
  workflow_dispatch:             # run it by hand the first time (Actions → Forge Charts → Run workflow)
  push:
    branches: [main]
    paths:
      - scripts/generate-charts.mjs

permissions:
  contents: write

concurrency:
  group: forge-charts
  cancel-in-progress: true

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Forge the charts
        run: node scripts/generate-charts.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a classic PAT (read:user, repo) as PROFILE_TOKEN to include private repos/contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit the refreshed charts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar-languages.svg assets/spline-contributions.svg assets/spline-daily.svg
          git diff --staged --quiet || git commit -m "chore(charts): refresh radar & splines"
          git push
