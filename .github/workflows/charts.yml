name: Forge Charts

# Refreshes the language radar + monthly & daily contribution splines in ./assets
on:
  schedule:
    - cron: "17 3 * * *"        # daily, 03:17 UTC
  workflow_dispatch:             # run it by hand the first time (Actions → Forge Charts → Run workflow)
  push:
    branches: [main]
    paths:
      - scripts/generate-charts.mjs

permissions:
  contents: write

concurrency:
  group: forge-charts
  cancel-in-progress: true

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Forge the charts
        run: node scripts/generate-charts.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a classic PAT (read:user, repo) as PROFILE_TOKEN to include private repos/contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit the refreshed charts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/radar-languages.svg \
            assets/spline-contributions.svg \
            assets/spline-daily.svg

          if git diff --staged --quiet; then
            echo "No chart changes to commit."
            exit 0
          fi

          git commit -m "chore(charts): refresh radar & splines"

          # Integrate any newer commits that landed on main after checkout
          git fetch origin main
          git rebase origin/main

          # Retry the push a few times in case another writer updates main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push after ${attempt} attempts." >&2
              exit 1
            fi

            echo "Push rejected; rebasing against the latest origin/main..."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done